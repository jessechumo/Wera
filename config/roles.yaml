    patterns: ['\b(research|lab(oratory)?|clinical|scientific) (associate|assistant|technician)', '\b(bench|formulation|process|analytical|R&D|food|environmental|soil|materials|polymer|protein|cell|lab(oratory)?|QC|bioprocess|biology|chemistry|immunology|toxicology|regulatory|assay|discovery|translational) scientist', '\bchemist\b', '\bbiologist', '\bmicrobiolog', '\bbiochem', '\bgeolog',
               '\benvironmental (scientist|specialist|technician)', '\bpostdoc', '\bpost-?doctoral', '\bmanufacturing (associate|technician|specialist)', '\bQ[AC] (analyst|associate|chemist|specialist|technician|inspector)',
               '\bregulatory (affairs|specialist|associate)', '\bclinical (trial|operations|research)', '\bepidemiolog', '\bbiostatistic', '\btoxicolog', '\bpharmacolog', '\bphysicist', '\bastronom']
  - id: construction
    label: "Construction & architecture"
    field: engineering
    patterns: ['\bconstruction', '\bsuperintendent', '\bestimator', '\bforeman', '\blaborer', '\bproject manager.{0,20}(construction|building)', '\barchitect\b.{0,10}(licensed|project|designer|job captain)',
               '\b(licensed|project|landscape|staff|junior) architect', '\bjob captain', '\bBIM (coordinator|manager|specialist)', '\bpreconstruction', '\bscheduler.{0,10}construction']

  # ---------- Trades & services ----------
  - id: skilled_trades
    label: "Skilled trades & maintenance"
    field: trades
    patterns: ['\belectrician', '\bplumber', '\bHVAC\b', '\bwelder', '\bmachinist', '\bcarpenter', '\bmechanic\b', '\bpipefitter', '\bmillwright', '\bboilermaker', '\bCNC\b', '\bdiesel',
               '\b(maintenance|service|field service|wind|solar|line|elevator|controls|automotive|auto|aircraft|avionics|A&P|instrument|refrigeration|appliance|fiber|cable|installation) (technician|tech|worker|mechanic)',
               '\bmaintenance (technician|worker|mechanic|supervisor|planner|lead)', '\binstaller\b', '\blineman', '\bpainter\b', '\broofer', '\bfacilities technician', '\bbuilding engineer', '\bstationary engineer']
  - id: manufacturing_warehouse
    label: "Manufacturing, warehouse & production"
    field: trades
    patterns: ['\b(production|assembly|manufacturing|machine|packaging|warehouse|distribution|fulfillment|shipping|receiving|inventory|plant) (associate|worker|operator|technician|supervisor|lead|clerk|specialist|team member)',
               '\bassembler', '\bmachine operator', '\bquality (inspector|technician|control)', '\bforklift', '\bmaterial handler', '\bpicker', '\bpacker', '\bloader\b', '\bstocker']
  - id: driving_delivery
    label: "Driving & delivery"
    field: trades
    patterns: ['\b(truck|delivery|CDL|bus|van|route|commercial|yard|shuttle|courier|class [ab]|tractor[- ]trailer|box truck|local|regional|OTR) driver', '\bdriver (helper|trainee)', '\bCDL\b', '\bcourier', '\bchauffeur', '\bdelivery (associate|specialist)']
  - id: hospitality_food
    label: "Hospitality, food & travel"
    field: trades
    patterns: ['\b(line|prep|sous|head|executive|pastry|banquet|short order) (cook|chef)', '\bcook\b', '\bchef\b', '\b(restaurant|banquet|cocktail|food) server', '^\s*server\b', '\bbartender', '\bbarista',
               '\bdishwasher', '\b(restaurant|kitchen|shift|front of house|food service|catering|hotel|cafe|bar) (manager|supervisor|lead|team member|associate|attendant)', '\bfood service', '\bhousekeep',
               '\bfront desk agent', '\bguest (service|services|relations|experience) (agent|associate|manager)', '\bconcierge', '\bflight attendant', '^\s*host(ess)?\s*$', '\b(restaurant|front of house|dining room) host', '\bbusser', '\bcrew member', '\bevent (staff|server)', '\bvalet']
  - id: retail
    label: "Retail & store"
    field: trades
    patterns: ['\b(retail|store|sales floor|stock|cashier|customer service) (associate|manager|supervisor|lead|clerk|team member|specialist)', '\bcashier', '\bmerchandis', '\bstore (advisor|associate|team member|employee|clerk)', '^\s*retail\b', '\bkeyholder',
               '\bstore (manager|director|leader)', '\bassistant (store )?manager', '\bbrand ambassador', '\bstylist', '\bsales associate', '\bshift (lead|leader|supervisor)', '\bdepartment (manager|supervisor|lead)']
  - id: personal_services
    label: "Beauty, fitness & personal services"
    field: trades
    patterns: ['\b(hair ?)?stylist', '\bcosmetologist', '\besthetician', '\bnail tech', '\bbarber', '\bmassage', '\b(personal|fitness) trainer', '\b(fitness|yoga|pilates|cycling|group fitness) instructor', '\bcoach\b', '\blifeguard', '\bspa (attendant|manager|coordinator)']
  - id: security_facilities
    label: "Security, safety & facilities"
    field: trades
    patterns: ['\bsecurity (officer|guard|supervisor|specialist)', '\bloss prevention', '\basset protection', '\bcorrections? officer', '\bpolice', '\bfirefighter', '\bEHS\b', '\b(environmental )?health (and|&) safety',
               '\bsafety (specialist|manager|coordinator|officer)', '\bjanitor', '\bcustodian', '\bgroundskeeper', '\benvironmental services', '\bEVS\b', '\bcleaner\b', '\bporter\b']

# Checked FIRST, and only for users who selected one of the override's
# families: a
# match skips the seniority checks (still subject to location/sponsorship).
# AI startups use "Member of Technical Staff" as a generic title; "staff"
# here is not seniority.
title_overrides:
  mts_infra:
    families: [ml_infra, infrastructure, platform, sre, devops, swe_infra]
    patterns: ['\bmember of technical staff\b.*\b(systems|infrastructure|infra|inference|platform|reliability|sre|devops|cloud|gpu)\b']
  mts_software:
    families: [software_engineering]
    patterns: ['\bmember of technical staff\b']

# Seniority levels a user can accept, in display order. Levels with
# patterns are detected from the title; a user who does not accept a level
# has titles matching its patterns dropped (reason title:<matched word>).
# "mid" has no marker: unmarked titles always pass and the LLM decides.
# A level's "except" patterns are cut from the title before its patterns
# are checked: "Staff Nurse" is an ordinary nursing job, not a senior one,
# and "IV Therapy" is not level IV ("Senior Staff Nurse" is still senior).
levels:
  - id: internship
    label: "Internship / co-op"
    patterns: ['\bintern(ship)?\b', '\bco-?op\b', '\bextern(ship)?\b', '\bstudent nurse', '\bnursing student']
  - id: entry
    label: "Entry level / new grad"
    patterns: ['\bjunior\b', '\bjr\.?\b', '\bnew grad', '\bentry[- ]level\b', '\bearly career\b', '\bassociate (software|data|engineer)',
               '\bgraduate nurse', '\b(nurse|RN) resident', '\b(nurse|RN|nursing) residency', '\btrainee\b', '\bapprentice']
  - id: mid
    label: "Mid level"
  - id: senior
    label: "Senior / staff / principal"
    patterns: ['\bsenior\b', '\bsr\.?\b', '\bstaff\b', '\bprincipal\b', '\blead\b', '\bIII\b', '\bIV\b', '\bdistinguished\b']
    except: ['\bstaff (nurse|RN|LPN|LVN|pharmacist|accountant|auditor|attorney|psychologist|psychiatrist|physician|therapist|physical therapist|occupational therapist|social worker|counselor|chaplain|dietitian|technologist|assistant|writer|photographer|interpreter|chef|clinician|anesthetist|nurse practitioner|veterinarian|teacher)',
             '\b(medical|nursing|clinical|office|support|kitchen|administrative|agency|float|per diem|PRN|house|camp|event) staff\b',
             '\bIV (therap\w*|team|infusion|nurse|RN|access|start|insertion|certified|pharmacist|room|admixture|hydration|lounge)', '\binfusion ?/ ?IV\b', '\bIV ?/ ?infusion',
             '\b(school|assistant|vice) principal\b']
  - id: management
    label: "Management"
    patterns: ['\b(engineering|software|technical|development|data|security|infrastructure|platform|IT) manager\b',
               '\bmanager,? (engineering|software|data)', '\bdirector\b', '\bhead of\b', '\bvp\b', '\bvice president\b', '\bchief\b',
               '\b(nurse|nursing|clinical|unit|practice|patient care|store|restaurant|general|branch|district|regional|plant|warehouse|kitchen) manager\b',
               '\bmanager,? (nursing|clinical|patient care)', '\bsupervisor\b', '\bsuperintendent\b', '\b(school|assistant|vice) principal\b', '\bdean\b']

location:
  allow_countries: ['US']
  # rule layer keeps a job if location text contains a US state/city/"United States"/"Remote - US"/"USA",
  # or is ambiguous ("Remote"); the LLM then confirms. Clearly non-US (London, Bangalore, Singapore...) is
  # dropped, but only for users with us_only set.

sponsorship:
  # Explicit refusal = hard exclude, for users who need sponsorship. Matched against the full plain-text
  # description. These were tested against real posting sentences (see the test table in PLAN.md).
  # Note the YAML single-quote escaping: an apostrophe inside a pattern is written as ''.
  exclude_patterns:
    - '\b(will|do|does|can) ?not (be )?(provid|offer|sponsor)\w*[^.]{0,60}(sponsor|visa)'
    - '\b(won''t|cannot|can''t|unable to|not able to) (be )?(provid|offer|sponsor)\w*[^.]{0,60}(sponsor|visa)'
    - '\b(do|does|will|can) ?not sponsor\b'
    - '\bno (visa |employment )?sponsorship\b'
    - '\bsponsorship (is |will )?not (be )?(available|provided|offered)'
    - '\bwithout (a |the |any )?(need for |requirement for |the need for )?(current or future |current |future |present or future )?(visa |employment |immigration )?sponsorship'
    - '\bnot (be )?(able|eligible) to sponsor'
    - '\bU\.?S\.? citizens? only\b'
    - '\bmust be a U\.?S\.? citizen'
    - '\bactive (security )?clearance (is )?required'
  # ITAR "U.S. person" requirements are flagged (not auto-excluded) and surfaced for manual review.
  flag_patterns:
    - 'ITAR'
    - 'U\.?S\.? persons?'
    - 'export control'
