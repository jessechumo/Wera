# WHAT counts as a match. All matching logic lives here; each user's
# preferences (chosen at signup) pick from this catalog:
#   - role_families: which families they want (a job must match one)
#   - levels: which seniority levels they accept
#   - needs_sponsorship / us_only: whether the sponsorship and location
#     rules apply to them
# Matching is case-insensitive. Patterns are Go regular expressions (RE2):
# no lookahead/lookbehind.

# Career fields group the role families on the signup form, in this order.
# Every family names one field.
fields:
  - { id: tech,        label: "Technology & data" }
  - { id: healthcare,  label: "Healthcare & nursing" }
  - { id: business,    label: "Business, finance & sales" }
  - { id: education,   label: "Education & social impact" }
  - { id: creative,    label: "Creative, writing & media" }
  - { id: engineering, label: "Engineering, science & construction" }
  - { id: trades,      label: "Trades, hospitality & services" }

# Role families. A family's id is stored with each match, so rename one
# only with a data migration.
role_families:
  - id: software_engineering
    label: "Software engineering"
    field: tech
    description: "Backend, frontend, full-stack, mobile, and general SWE."
    patterns: ['\bsoftware (engineer|developer|development engineer)', '\bSDE\b', '\bback[- ]?end\b', '\bfront[- ]?end\b',
               '\bfull[- ]?stack\b', '\bmobile (engineer|developer)', '\b(ios|android) (engineer|developer)',
               '\bweb (developer|engineer)', '\bforward deployed engineer', '\bmember of technical staff\b',
               '\bapplication (engineer|developer)', '\bproduct engineer']
  - id: sre
    label: "Site reliability (SRE)"
    field: tech
    patterns: ['\bsite reliability\b', '\bSRE\b', '\breliability engineer']
  - id: platform
    label: "Platform engineering"
    field: tech
    patterns: ['\bplatform engineer', '\bcloud platform\b', '\binfrastructure platform']
  - id: devops
    label: "DevOps / build & release"
    field: tech
    patterns: ['\bdevops\b', '\bbuild (and|&) release\b', '\brelease engineer']
  - id: infrastructure
    label: "Infrastructure / cloud / systems"
    field: tech
    patterns: ['\binfrastructure engineer', '\binfrastructure software engineer', '\bcloud engineer', '\bsystems? engineer', '\blinux\b']
  - id: swe_infra
    label: "Software engineering on infrastructure teams"
    field: tech
    patterns: ['\bsoftware engineer\b.*\b(infra|infrastructure|platform|reliability|systems|cloud|devops|observability)\b',
               '\b(infra|infrastructure|platform|observability)\b.*\bsoftware engineer\b']
  - id: production
    label: "Production engineering / support"
    field: tech
    patterns: ['\bproduction engineer', '\bproduction support\b']
  - id: trading_ops
    label: "Trading operations / trade support"
    field: tech
    patterns: ['\btrad(e|ing) (operations|ops|support|systems)', '\btrade systems engineer', '\bapplication support engineer']
  - id: ml_infra
    label: "ML / AI infrastructure"
    field: tech
    patterns: ['\bml infrastructure\b', '\bmlops\b', '\bai infrastructure\b', '\binference\b', '\bml platform\b', '\bgpu (infrastructure|platform|cloud)\b']
  - id: ml_engineering
    label: "Machine learning / AI engineering"
    field: tech
    patterns: ['\bmachine learning\b', '\bML (engineer|scientist|developer)', '\bAI (engineer|developer)', '\bapplied (scientist|ml|ai)\b',
               '\bdeep learning\b', '\bcomputer vision\b', '\bNLP\b', '\bLLM\b', '\bperception (engineer|software)']
  - id: data_science
