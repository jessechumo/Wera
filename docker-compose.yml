services:
  postgres:
    image: postgres:16-alpine
    container_name: wera-postgres
    environment:
      POSTGRES_USER: wera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wera}
      POSTGRES_DB: wera
    ports:
      # Host-only: lets `go run ./cmd/wera ...` reach the DB, never the LAN.
      - "127.0.0.1:5433:5432"   # 5432 on the host is taken by a native PostgreSQL install
    volumes:
      - wera-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wera -d wera"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Full stack (database, migrations, API, worker, dashboard):
  #   docker compose up -d --build
  # `docker compose up -d postgres` still starts only the database.

  # One-shot: applies embedded migrations, then exits. API and worker wait on it.
  wera-migrate:
    build: .
    image: wera:local
    container_name: wera-migrate
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://wera:${POSTGRES_PASSWORD:-wera}@postgres:5432/wera?sslmode=disable
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  wera-api:
    build: .
    image: wera:local
    container_name: wera-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://wera:${POSTGRES_PASSWORD:-wera}@postgres:5432/wera?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_FORMAT: json
    volumes:
      - ./config:/app/config:ro
      - ./profile:/app/profile:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      wera-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/wera", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  wera-worker:
    build: .
    image: wera:local
    container_name: wera-worker
    command: ["worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://wera:${POSTGRES_PASSWORD:-wera}@postgres:5432/wera?sslmode=disable
      LOG_FORMAT: json
    volumes:
      - ./config:/app/config:ro
      - ./profile:/app/profile:ro
    depends_on:
      postgres:
        condition: service_healthy
      wera-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/wera", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Dashboard (../wera-frontend): nginx serves the SPA and proxies /api to
  # wera-api. Published on all interfaces so other machines on the LAN can use it.
  wera-web:
    build: ../wera-frontend
    image: wera-web:local
    container_name: wera-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      wera-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  wera-pgdata:
