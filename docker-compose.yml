# Docker keeps container logs forever unless told otherwise.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wera-postgres
    logging: *logging
    environment:
      POSTGRES_USER: wera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wera}
      POSTGRES_DB: wera
    ports:
      # Host-only: lets `go run ./cmd/wera ...` reach the DB, never the LAN.
      - "127.0.0.1:5433:5432"   # 5432 on the host is taken by a native PostgreSQL install
    volumes:
      - wera-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wera -d wera"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Full stack (database, migrations, API, worker, dashboard):
  #   docker compose up -d --build
  # `docker compose up -d postgres` still starts only the database.

  # Local embedding model (Snowflake/snowflake-arctic-embed-m-v1.5, CPU, about 1 GB RAM): ranks
  # every pending job for each user without an AI call, so only the best
  # ranked get a paid AI score. Downloads the model (~440 MB) on first start.
  wera-embed:
    container_name: wera-embed
    logging: *logging
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "Snowflake/snowflake-arctic-embed-m-v1.5", "--auto-truncate", "--max-batch-tokens", "8192", "--tokenization-workers", "2"]
    volumes:
      - wera-embed-models:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # One-shot: applies embedded migrations, then exits. API and worker wait on it.
  wera-migrate:
    build:
      context: .
      args:
        VERSION: ${WERA_VERSION:-dev}
        COMMIT: ${WERA_COMMIT:-unknown}
    image: wera:local
    container_name: wera-migrate
    logging: *logging
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://wera:${POSTGRES_PASSWORD:-wera}@postgres:5432/wera?sslmode=disable
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  wera-api:
    build:
      context: .
      args:
        VERSION: ${WERA_VERSION:-dev}
        COMMIT: ${WERA_COMMIT:-unknown}
    image: wera:local
    container_name: wera-api
    logging: *logging
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://wera:${POSTGRES_PASSWORD:-wera}@postgres:5432/wera?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_FORMAT: json
      EMBED_BASE_URL: http://wera-embed/v1
    volumes:
      - ./config:/app/config:ro
      - ./profile:/app/profile:ro   # only for `wera users import-profile`
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      wera-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/wera", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  wera-worker:
    build:
      context: .
      args:
        VERSION: ${WERA_VERSION:-dev}
        COMMIT: ${WERA_COMMIT:-unknown}
    image: wera:local
    container_name: wera-worker
    logging: *logging
    command: ["worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://wera:${POSTGRES_PASSWORD:-wera}@postgres:5432/wera?sslmode=disable
      LOG_FORMAT: json
      EMBED_BASE_URL: http://wera-embed/v1
    volumes:
      - ./config:/app/config:ro
      - ./profile:/app/profile:ro   # only for `wera users import-profile`
    depends_on:
      postgres:
        condition: service_healthy
      wera-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/wera", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Dashboard (../wera-frontend): nginx serves the SPA and proxies /api to
  # wera-api. Published on all interfaces so other machines on the LAN can use it.
  wera-web:
    build:
      context: ../wera-frontend
      args:
        APP_COMMIT: ${WERA_WEB_COMMIT:-dev}
    image: wera-web:local
    container_name: wera-web
    logging: *logging
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      wera-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # The admin console (../wera-admin): nginx serving the app and proxying
  # /api to wera-api. It answers private networks only; never route it
  # through the public tunnel.
  wera-admin:
    build:
      context: ../wera-admin
      args:
        APP_COMMIT: ${WERA_ADMIN_COMMIT:-dev}
    image: wera-admin:local
    container_name: wera-admin
    logging: *logging
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      wera-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Public access (opt in: `docker compose --profile public up -d`). A second
  # API instance for traffic from the internet (the Vercel dashboard), with
  # secure cookies and proxy headers trusted; wera-api keeps serving the LAN
  # over plain HTTP. Both share the database. Not published on any port:
  # only the tunnel reaches it.
  wera-api-public:
    profiles: [public]
    image: wera:local
    container_name: wera-api-public
    logging: *logging
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://wera:${POSTGRES_PASSWORD:-wera}@postgres:5432/wera?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_FORMAT: json
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-}
      EMBED_BASE_URL: http://wera-embed/v1
    volumes:
      - ./config:/app/config:ro
    depends_on:
      wera-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/wera", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Cloudflare quick tunnel to wera-api-public: an outbound connection, so no
  # router ports are opened. Its https://*.trycloudflare.com address changes
  # whenever this container restarts; deploy/home/tunnel-watch.sh replaces a
  # tunnel that a long outage killed and keeps vercel.json up to date. Move
  # to a named tunnel once there is a domain. The metrics port is how the
  # watch reads the address; it is not published.
  wera-tunnel:
    profiles: [public]
    image: cloudflare/cloudflared:2026.10.7
    container_name: wera-tunnel
    logging: *logging
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://wera-api-public:8080
    depends_on:
      wera-api-public:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wera-pgdata:
  wera-embed-models:
