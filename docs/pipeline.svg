<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Wera: matching pipeline</title>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1F2328" flood-opacity=".07"/></filter>
<marker id="arrow-57606A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606A"/></marker>
</defs>
<rect width="100%" height="100%" rx="18" fill="#FBFAF7"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#1F2328">Wera: matching pipeline</text>
<text x="32" y="66" font-size="12.5" fill="#57606A">From job boards to a ranked list. Most work is shared across users or done locally; the LLM sees each posting once.</text>
<g filter="url(#shadow)"><rect x="36" y="104" width="270" height="150" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="36" y="104" width="4" height="150" rx="2" fill="#B76E00"/>
<rect x="50" y="117" width="32" height="32" rx="8" fill="#B76E0019"/>
<g transform="translate(54 121) scale(1)" fill="none" stroke="#B76E00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5M3 13h18"/></g>
<text x="92" y="131" font-size="14" font-weight="650" fill="#1F2328">1. Fetch boards</text>
<text x="52" y="162" font-size="11.5" fill="#57606A">ETag sent: unchanged boards answer 304</text>
<text x="52" y="178" font-size="11.5" fill="#57606A">Workday: new postings only, full</text>
<text x="52" y="194" font-size="11.5" fill="#57606A">sweep daily; shared polite throttle</text>
<rect x="52" y="222" width="173.5" height="20" rx="10" fill="#B76E0014" stroke="#B76E004C"/>
<text x="60" y="236" font-size="10.5" fill="#B76E00">unchanged board ≈ 0 bytes</text>
<g filter="url(#shadow)"><rect x="336" y="104" width="270" height="150" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="336" y="104" width="4" height="150" rx="2" fill="#1A7F37"/>
<rect x="350" y="117" width="32" height="32" rx="8" fill="#1A7F3719"/>
<g transform="translate(354 121) scale(1)" fill="none" stroke="#1A7F37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8v-13"/><path d="M4.5 12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8"/></g>
<text x="392" y="131" font-size="14" font-weight="650" fill="#1F2328">2. Store changes</text>
<text x="352" y="162" font-size="11.5" fill="#57606A">content hash per posting: only new</text>
<text x="352" y="178" font-size="11.5" fill="#57606A">or changed rows are written</text>
<text x="352" y="194" font-size="11.5" fill="#57606A">bulk COPY upsert</text>
<rect x="352" y="222" width="135.7" height="20" rx="10" fill="#1A7F3714" stroke="#1A7F374C"/>
<text x="360" y="236" font-size="10.5" fill="#1A7F37">shared by all users</text>
<g filter="url(#shadow)"><rect x="636" y="104" width="270" height="150" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="636" y="104" width="4" height="150" rx="2" fill="#0E7C86"/>
<rect x="650" y="117" width="32" height="32" rx="8" fill="#0E7C8619"/>
<g transform="translate(654 121) scale(1)" fill="none" stroke="#0E7C86" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5L4 5z"/></g>
<text x="692" y="131" font-size="14" font-weight="650" fill="#1F2328">3. Rule filter</text>
<text x="652" y="162" font-size="11.5" fill="#57606A">per user: role families, seniority,</text>
<text x="652" y="178" font-size="11.5" fill="#57606A">US-only, sponsorship refusals</text>
<text x="652" y="194" font-size="11.5" fill="#57606A">(regex on keyword windows)</text>
<rect x="652" y="222" width="148.29999999999998" height="20" rx="10" fill="#0E7C8614" stroke="#0E7C864C"/>
<text x="660" y="236" font-size="10.5" fill="#0E7C86">free · 40k jobs ≈ 4 s</text>
<g filter="url(#shadow)"><rect x="936" y="104" width="270" height="150" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="936" y="104" width="4" height="150" rx="2" fill="#0E7C86"/>
<rect x="950" y="117" width="32" height="32" rx="8" fill="#0E7C8619"/>
<g transform="translate(954 121) scale(1)" fill="none" stroke="#0E7C86" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g>
<text x="992" y="131" font-size="14" font-weight="650" fill="#1F2328">4. Local ranking</text>
<text x="952" y="162" font-size="11.5" fill="#57606A">TF-IDF match to the profile gives</text>
<text x="952" y="178" font-size="11.5" fill="#57606A">an estimated score, so a new user</text>
<text x="952" y="194" font-size="11.5" fill="#57606A">sees ranked jobs in seconds</text>
<rect x="952" y="222" width="97.89999999999999" height="20" rx="10" fill="#0E7C8614" stroke="#0E7C864C"/>
<text x="960" y="236" font-size="10.5" fill="#0E7C86">free · no LLM</text>
<g filter="url(#shadow)"><rect x="96" y="330" width="270" height="150" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="96" y="330" width="4" height="150" rx="2" fill="#7C3AED"/>
<rect x="110" y="343" width="32" height="32" rx="8" fill="#7C3AED19"/>
<g transform="translate(114 347) scale(1)" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></g>
<text x="152" y="357" font-size="14" font-weight="650" fill="#1F2328">5. Shared facts</text>
<text x="112" y="388" font-size="11.5" fill="#57606A">one LLM call per posting version:</text>
<text x="112" y="404" font-size="11.5" fill="#57606A">seniority, years, sponsorship</text>
<text x="112" y="420" font-size="11.5" fill="#57606A">(quote must appear verbatim)</text>
<rect x="112" y="448" width="198.7" height="20" rx="10" fill="#7C3AED14" stroke="#7C3AED4C"/>
<text x="120" y="462" font-size="10.5" fill="#7C3AED">1 call per posting, all users</text>
<g filter="url(#shadow)"><rect x="396" y="330" width="270" height="150" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="396" y="330" width="4" height="150" rx="2" fill="#0E7C86"/>
<rect x="410" y="343" width="32" height="32" rx="8" fill="#0E7C8619"/>
<g transform="translate(414 347) scale(1)" fill="none" stroke="#0E7C86" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></g>
<text x="452" y="357" font-size="14" font-weight="650" fill="#1F2328">6. Fact exclusions</text>
<text x="412" y="388" font-size="11.5" fill="#57606A">too many years, no sponsorship,</text>
<text x="412" y="404" font-size="11.5" fill="#57606A">outside the US, too senior:</text>
<text x="412" y="420" font-size="11.5" fill="#57606A">excluded before any fit call</text>
<rect x="412" y="448" width="173.5" height="20" rx="10" fill="#0E7C8614" stroke="#0E7C864C"/>
<text x="420" y="462" font-size="10.5" fill="#0E7C86">free · ~half of jobs drop</text>
<g filter="url(#shadow)"><rect x="696" y="330" width="270" height="150" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="696" y="330" width="4" height="150" rx="2" fill="#7C3AED"/>
<rect x="710" y="343" width="32" height="32" rx="8" fill="#7C3AED19"/>
<g transform="translate(714 347) scale(1)" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5a3 3 0 0 0-3 3v.2A3 3 0 0 0 4.5 13a3 3 0 0 0 2 4.6A3 3 0 0 0 12 18V6a2.5 2.5 0 0 0-3-1.5z"/><path d="M15 4.5a3 3 0 0 1 3 3v.2A3 3 0 0 1 19.5 13a3 3 0 0 1-2 4.6A3 3 0 0 1 12 18"/></g>
<text x="752" y="357" font-size="14" font-weight="650" fill="#1F2328">7. Fit score</text>
<text x="712" y="388" font-size="11.5" fill="#57606A">compact job card + profile, cached</text>
<text x="712" y="404" font-size="11.5" fill="#57606A">prompt prefix; best estimates first,</text>
<text x="712" y="420" font-size="11.5" fill="#57606A">or instantly when a job is opened</text>
<rect x="712" y="448" width="123.1" height="20" rx="10" fill="#7C3AED14" stroke="#7C3AED4C"/>
<text x="720" y="462" font-size="10.5" fill="#7C3AED">≈ $0.0004 per job</text>
<path d="M306 174 L336 174" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow-57606A)"/>
<path d="M606 174 L636 174" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow-57606A)"/>
<path d="M906 174 L936 174" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow-57606A)"/>
<path d="M1071.0 254 L1071.0 292 L231.0 292 L231.0 330" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow-57606A)"/>
<path d="M366 400 L396 400" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow-57606A)"/>
<path d="M666 400 L696 400" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow-57606A)"/>
<g filter="url(#shadow)"><rect x="1006" y="348" width="168" height="114" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="1006" y="348" width="4" height="114" rx="2" fill="#D9572B"/>
<rect x="1020" y="361" width="32" height="32" rx="8" fill="#D9572B19"/>
<g transform="translate(1024 365) scale(1)" fill="none" stroke="#D9572B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></g>
<text x="1062" y="375" font-size="14" font-weight="650" fill="#1F2328">Your lists</text>
<text x="1022" y="406" font-size="11.5" fill="#57606A">Today, Jobs,</text>
<text x="1022" y="422" font-size="11.5" fill="#57606A">Industries, Tracker</text>
<path d="M966 400 L1006 400" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow-57606A)"/>
<text x="36" y="528" font-size="12" font-weight="650" fill="#57606A" text-anchor="start">Measured on the dev data:</text>
<rect x="200" y="514" width="230.2" height="20" rx="10" fill="#D9572B14" stroke="#D9572B4C"/>
<text x="208" y="528" font-size="10.5" fill="#D9572B">new user ready in ~5 s (was 5 min)</text>
<rect x="440.2" y="514" width="198.7" height="20" rx="10" fill="#7C3AED14" stroke="#7C3AED4C"/>
<text x="448.2" y="528" font-size="10.5" fill="#7C3AED">fit call $0.00038 vs $0.00075</text>
<rect x="648.9" y="514" width="274.3" height="20" rx="10" fill="#0E7C8614" stroke="#0E7C864C"/>
<text x="656.9" y="528" font-size="10.5" fill="#0E7C86">22 of 46 jobs excluded without a fit call</text>
<rect x="933.2" y="514" width="236.5" height="20" rx="10" fill="#1A7F3714" stroke="#1A7F374C"/>
<text x="941.2" y="528" font-size="10.5" fill="#1A7F37">refilter 43,732 jobs: 9.3 s → 4.1 s</text>
<text x="36" y="566" font-size="11" font-weight="400" fill="#8C959F" text-anchor="start">Legend:</text>
<rect x="90" y="552" width="135.7" height="20" rx="10" fill="#1A7F3714" stroke="#1A7F374C"/>
<text x="98" y="566" font-size="10.5" fill="#1A7F37">shared across users</text>
<rect x="233.7" y="552" width="85.3" height="20" rx="10" fill="#0E7C8614" stroke="#0E7C864C"/>
<text x="241.7" y="566" font-size="10.5" fill="#0E7C86">local, free</text>
<rect x="327.0" y="552" width="34.9" height="20" rx="10" fill="#7C3AED14" stroke="#7C3AED4C"/>
<text x="335.0" y="566" font-size="10.5" fill="#7C3AED">LLM</text>
<rect x="369.9" y="552" width="79.0" height="20" rx="10" fill="#B76E0014" stroke="#B76E004C"/>
<text x="377.9" y="566" font-size="10.5" fill="#B76E00">job boards</text>
</svg>
