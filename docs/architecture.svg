<text x="676" y="372" font-size="10.5" font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E7C86">Go · same binary</text>
<text x="636" y="392" font-size="11.5" fill="#57606A">scheduled runs (RUN_SCHEDULE)</text>
<text x="636" y="408" font-size="11.5" fill="#57606A">fetch → filter → rank → score</text>
<text x="636" y="424" font-size="11.5" fill="#57606A">pauses during Workday maintenance</text>
<text x="636" y="440" font-size="11.5" fill="#57606A">catch-up run afterwards</text>
<text x="636" y="456" font-size="11.5" fill="#57606A">advisory lock: one run at a time</text>
