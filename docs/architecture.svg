<text x="32" y="44" font-size="20" font-weight="700" fill="#1F2328">Wera: system architecture</text>
<text x="32" y="66" font-size="12.5" fill="#57606A">Three containers and PostgreSQL on one host; public job boards and an LLM API outside. Arrows show who calls whom.</text>
