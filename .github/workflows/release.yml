name: Release

# release-please reads the Conventional Commits on main and keeps a
# release PR open with the next version and its CHANGELOG. Merging that
# PR tags the release; this workflow then attaches binaries and pushes
# the Docker image to GitHub Container Registry.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: jessechumo/wera
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X wera/internal/buildinfo.Version=${TAG} -X wera/internal/buildinfo.Commit=${GITHUB_SHA::7}" \
              -o dist/wera ./cmd/wera
            cp LICENSE README.md dist/
            tar -czf "dist/wera_${TAG}_linux_${arch}.tar.gz" -C dist wera LICENSE README.md
            rm dist/wera dist/LICENSE dist/README.md
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.IMAGE }}:${{ env.TAG }}
            ghcr.io/${{ env.IMAGE }}:latest
