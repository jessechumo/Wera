version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "fix(deps)", prefix-development: "chore(deps)" }
    groups:
      go-modules: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    # One PR for all action updates instead of one branch per action.
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(docker)" }
  # The images docker-compose.yml names (cloudflared sat a year out of date).
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy/hetzner"]
    schedule: { interval: weekly }
    commit-message: { prefix: "build(docker)" }
    ignore:
      # A new Postgres major needs a dump and restore, not a version bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
